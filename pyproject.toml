[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stui-terminal"
version = "2.4.0"
description = "A tiny Streamlit-inspired terminal UI experiment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MarMar Labs" }]
keywords = ["terminal", "tui", "textual", "streamlit-inspired"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Terminals",
]
dependencies = [
  "rich>=13.7",
  "textual>=8.2.5",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/MarMarLabs/stui-terminal"
Repository = "https://github.com/MarMarLabs/stui-terminal"
Issues = "https://github.com/MarMarLabs/stui-terminal/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.scripts]
stui = "stui.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
